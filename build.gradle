buildscript {
    repositories {
        maven { url = "https://plugins.gradle.org/m2/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.2'
    }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    // 26.x ships unobfuscated, so this is Loom's no-remap plugin: no mappings, no refmap, no remapJar.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.google.protobuf' version '0.9.4'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'com.diffplug.spotless' version '8.10.4'
}

apply plugin: 'org.jetbrains.gradle.plugin.idea-ext'
apply from: 'gradle/spotless.gradle'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Build-tool and loader classpaths need this source set before its compiler setup.
sourceSets { declaration }
apply from: 'gradle/abi.gradle'

apply from: 'gradle/local-properties.gradle'
apply from: 'gradle/native.gradle'
apply from: 'gradle/builtin-index.gradle'

version = mod_version
group = 'com.elfmcys.ysm'
base {
    archivesName = 'ysm'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withJavadocJar()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def resourceDebug = ysmLocalBooleanProperty('ysm.resource_debug', false)

// PORT(26.3-fabric): Forge-only integrations are excluded until each has a Fabric 26.3 counterpart.
// The original sources stay in the tree untouched; see PROJECT_MEMORY.md.
def portExcludedSources = [
        'com/elfmcys/ysm/client/compat/**',
        'com/elfmcys/ysm/mixin/client/create/**',
        'com/elfmcys/ysm/mixin/client/embeddium/**',
        'com/elfmcys/ysm/mixin/client/parcool/**',
]
// Exclusion is limited to src/main/java so the same-name stubs below are not excluded with it.
def portMainJavaRoot = file('src/main/java').toPath()
def portExcludedSpec = new org.gradle.api.tasks.util.PatternSet().include(portExcludedSources).asSpec
sourceSets.main.java {
    // Files only: an include-only PatternSet accepts every directory, which would drop the whole tree.
    exclude { details -> !details.directory && details.file.toPath().startsWith(portMainJavaRoot)
        && portExcludedSpec.isSatisfiedBy(details) }
    // Same-name stubs for excluded integrations; each reports its mod as absent.
    srcDir 'src/port/compat-disabled/java'
}

loom {
    accessWidenerPath = file('src/main/resources/ysm.accesswidener')

    mods {
        ysm {
            sourceSet sourceSets.main
            sourceSet sourceSets.declaration
        }
    }

    runs {
        configureEach {
            if (resourceDebug) {
                environmentVariable('YSM_DEBUG_RESOURCE', '1')
            }
            vmArgs '-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition'
        }
        client {
            client()
            runDir 'run/client_a'
        }
        client2 {
            client()
            runDir 'run/client_b'
            programArgs '--username', 'tartaric_acid'
        }
        server {
            server()
            runDir 'run/server'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

apply from: 'gradle/declaration.gradle'

processResources {
    inputs.property "mod_version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    filteringCharset "UTF-8"

    from("LICENSE")
    from("NOTICE.md")

    filesMatching("fabric.mod.json") {
        expand "mod_version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version
    }
    // PORT(26.3-fabric): Forge descriptors are kept in the tree for reference but not shipped.
    exclude 'META-INF/mods.toml'
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

def mavenCentralHosts = ['repo.maven.apache.org', 'repo1.maven.org']
repositories.withType(MavenArtifactRepository).configureEach { repo ->
    if (!mavenCentralHosts.contains(repo.url.host)) {
        repo.content {
            excludeGroup 'com.google.protobuf'
            excludeGroup 'us.hebi.quickbuf'
        }
    }
}

configurations {
    ysmImplementation
    implementation.extendsFrom ysmImplementation
}

ext.ysmBundledExpressionLibraries = Collections.unmodifiableMap([
        'dev.semaweave:semaweave-engine:0.1.0-SNAPSHOT':
                file('libs/semaweave-engine-0.1.0-SNAPSHOT.jar'),
        'dev.semaweave:semaweave-backend-janino:0.1.0-SNAPSHOT':
                file('libs/semaweave-backend-janino-0.1.0-SNAPSHOT.jar'),
        'org.codehaus.janino:janino:3.1.12-semaweave': file('libs/janino-3.1.12-semaweave.jar')
])

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // ForgeConfigSpec on Fabric; a separate runtime mod, declared as a dependency in fabric.mod.json.
    implementation "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"
    // FCAP nests night-config 3.8.4 as jar-in-jar; ForgeConfigSpec extends its types, so javac needs them.
    compileOnly "com.electronwill.night-config:core:3.8.4"
    compileOnly "com.electronwill.night-config:toml:3.8.4"

    compileOnly 'org.jetbrains:annotations:26.0.2'

    ysmImplementation files('libs/quickbuf-runtime-1.4.1-ysm.jar')
    ysmImplementation 'org.jetbrains:annotations:26.0.2'
    ysmImplementation files(ysmBundledExpressionLibraries.values())
    // File dependencies do not carry the runtime dependencies declared in their POMs.
    ysmImplementation 'org.codehaus.janino:commons-compiler:3.1.12'
    // Fabric Loader supplies runtime ASM and MixinExtras; relocating ASM would break the Mixin plugin ABI.
    compileOnly 'org.ow2.asm:asm:9.7.1'
    compileOnly 'org.ow2.asm:asm-tree:9.7.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.protobuf:protobuf-java:3.21.12'
    testImplementation files(tasks.named('relocateProcessorAsm', Jar).flatMap { it.archiveFile })
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}

// PORT(26.3-fabric): verification sources depend on the Forge mock harness (gradle/mock.gradle),
// which is not ported yet. Point test at an empty root so `check` stays meaningful once restored.
sourceSets {
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

jar {
    manifest.attributes([
            "Implementation-Title"  : project.name,
            "Implementation-Version": "${version}"
    ])
    archiveClassifier = "raw"
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

tasks.named('shadowJar') {
    dependsOn tasks.named('relocateProcessorAsm')
    from(sourceSets.main.output)
    from(sourceSets.declaration.output) {
        exclude 'META-INF/services/javax.annotation.processing.Processor'
    }
    from(tasks.named('relocateProcessorAsm', Jar).flatMap { it.archiveFile }.map { archive ->
        project.zipTree(archive.asFile)
    })
    configurations = [project.configurations.ysmImplementation]
    archiveClassifier = ''
    addMultiReleaseAttribute = false
    mergeServiceFiles()
    exclude '**/*.proto'
    exclude '/META-INF/maven/**'
    exclude '/META-INF/native-image/*'
    exclude '/META-INF/proguard/*'
    relocate 'us.hebi.quickbuf', 'com.elfmcys.quickbuf'
    relocate 'mixel', 'com.elfmcys.mixel'
    relocate 'dev.semaweave', 'com.elfmcys.ysm.internal.expression.semaweave'
    relocate 'org.codehaus.janino', 'com.elfmcys.ysm.internal.expression.janino'
    relocate 'org.codehaus.commons.compiler', 'com.elfmcys.ysm.internal.expression.commonscompiler'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += [
            '-Xlint:-removal',
            '-parameters',
            '-Xmaxerrs', '100000'
    ]
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

apply from: 'gradle/schema.gradle'
