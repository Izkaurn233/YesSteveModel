#This file is read by Gradle to pick the daemon JVM (Gradle daemon JVM criteria).
# PORT(26.3-fabric): Minecraft 26.x, Loom 1.19 and buildSrc need Java 25. IDEs that launch Gradle with an
# older JVM (IntelliJ defaulted to 21) get a Java 25 daemon from the local toolchains instead.
toolchainVersion=25
